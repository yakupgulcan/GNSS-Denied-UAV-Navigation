# =============================================================================
# GNSS-Denied Navigation - Main Configuration
# =============================================================================
# All tunable parameters for the visual navigation system.
# Override these values in launch files or via command line.

# --- Visual Estimator Node ---
visual_estimator_node:
  ros__parameters:
    # Map database built with build_map_db (the feature method is read from it).
    # Legacy build_feature_database_* files are still accepted.
    db_path: "~/frames_2026-11-02_15-19-00/features_db_sift_2000.npz"

    # GPS reference origin for ENU conversions
    start_lat: -35.3766471
    start_lon: 149.1652375

    # Camera horizontal FOV (rad); /camera/image is the 2.0 rad gimbal camera
    camera_hfov: 2.0

    # Smoothing factor for position updates (0.0 = no correction, 1.0 = full snap)
    smoothing_alpha: 0.4

    # No matching below this height above take-off (m)
    min_altitude: 15.0

    # Map frames matched per camera frame, nearest to the predicted position
    max_candidates: 3

    # Search radius around the predicted position (m); grows without fixes
    search_radius: 40.0
    search_radius_growth: 2.0   # m per second since the last fix
    max_search_radius: 150.0

# --- Ground Control Station (nav_gcs) ---
visual_gui_node:
  ros__parameters:
    start_lat: -35.3766471
    start_lon: 149.1652375
    target_pos_x: 0.0
    target_pos_y: 2900.0

# --- Optical Flow (velocity between map fixes) ---
visual_velocity_estimator:
  ros__parameters:
    camera_hfov: 2.0      # effective FOV (CameraZoomPlugin overrides the SDF's 1.41)
    publish_rate: 10.0    # max processed frames per simulated second
    lpf_alpha: 0.5        # low-pass on ENU velocity (1.0 = off)
    min_altitude: 1.0

# --- Navigation Runner (Planner) ---
visual_navigation_planner:
  ros__parameters:
    # Target position in local ENU frame (meters)
    target_pos_x: 0.0
    target_pos_y: 2900.0
    acceptance_radius: 30.0
    
    # GPS reference origin
    start_lat: -35.3766471
    start_lon: 149.1652375
    
    # Flight parameters
    target_altitude: 30.0
    max_speed: 3.0
    
    # Control gains
    pos_p_gain: 0.5
    turn_threshold: 30.0
    lookahead_distance: 50.0
    
    # Altitude PID
    kp_altitude: 17.0
    hover_pwm: 1500
    max_climb_pwm: 1750
    max_descend_pwm: 1250
    height_acceptance_error: 0.2

# --- Base Controller (Velocity/Yaw PID) ---
velocity_yaw_controller:
  ros__parameters:
    target_altitude: 30.0
    hover_pwm: 1500
    brake_gain: 120.0
    stop_threshold: 0.2
    
    # Forward velocity PID
    pid_forward_kp: 50.0
    pid_forward_ki: 2.0
    pid_forward_kd: 5.0
    
    # Lateral velocity PID
    pid_lateral_kp: 150.0
    pid_lateral_ki: 5.0
    pid_lateral_kd: 10.0
    
    # Yaw PID
    pid_yaw_kp: 20.0
    pid_yaw_ki: 0.6
    pid_yaw_kd: 0.5
    
    # Altitude PID
    pid_alt_kp: 20.0
    pid_alt_ki: 2.0
    pid_alt_kd: 5.0

# =============================================================================
# GUIDED pipeline (gnss_denied_guided.launch.py): the visual estimate is sent
# to ArduPilot as GPS_INPUT and the autopilot flies the mission itself.
# =============================================================================

# --- GPS Input Bridge (visual estimate -> MAVLink GPS_INPUT) ---
gps_input_bridge:
  ros__parameters:
    publish_rate: 5.0         # ArduPilot expects a steady 5 Hz GPS
    stale_timeout: 1.0        # stop the stream if the estimate is older (s)
    origin_alt_msl: 584.0     # home altitude AMSL (m)
    horiz_accuracy: 4.0       # reported 1-sigma (m); the EKF only aligns below 5 m
    vert_accuracy: 3.0
    hdop: 1.0
    satellites_visible: 10

# --- Guided Mission (takeoff -> target -> land in GUIDED) ---
guided_mission:
  ros__parameters:
    start_lat: -35.3766471
    start_lon: 149.1652375
    target_pos_x: 0.0
    target_pos_y: 2900.0
    target_altitude: 30.0
    acceptance_radius: 10.0
    settle_time: 5.0
    land_on_arrival: true
